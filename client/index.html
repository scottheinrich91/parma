          if (isDark) {
            document.documentElement.classList.add('dark');
            document.documentElement.style.colorScheme = 'dark';
          } else {
            document.documentElement.classList.remove('dark');
            document.documentElement.style.colorScheme = 'light';
          }

          // 2. Active Theme Variables
          var savedTheme = localStorage.getItem('parma_selected_theme') || '';
          var effectiveTheme = (savedTheme && savedTheme.trim() && savedTheme.trim() !== 'vault') ? savedTheme.trim() : 'parma-classic';
          document.documentElement.setAttribute('data-parma-theme', savedTheme || 'parma-classic');

          var preset = THEMES[effectiveTheme] || THEMES['parma-classic'];
          function objToCss(o) {
            var res = '';
            for (var k in o) {
              res += '  ' + k + ': ' + o[k] + ';\n';
            }
            return res;
          }

          var lightCss = objToCss(preset.light);
          var darkCss = objToCss(preset.dark);
          var customCss = localStorage.getItem('parma_custom_css') || '';

          if (!styleEl) {
            styleEl = document.createElement('style');
            styleEl.id = 'parma-active-theme';
            document.head.appendChild(styleEl);
          }

            (customCss ? '\n/* Saved Custom CSS */\n' + customCss : '');

          var meta = document.getElementById('theme-color-meta');
          if (meta) {
            meta.setAttribute('content', bgPrimary);
          }
        } catch (e) {
          console.warn('Parma theme pre-init error:', e);
        }
      })();
    </script>
  </head>
  <body class="bg-wiki-light dark:bg-slate-900 text-slate-900 dark:text-slate-100">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
