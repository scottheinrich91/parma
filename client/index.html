<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
    <title>Parma — Lightweight Web Wiki</title>

    <!-- Standard Favicon -->
    <link rel="icon" type="image/png" href="/favicon.png" id="parma-favicon" />
    <link rel="shortcut icon" href="/favicon.png" />

    <!-- Apple iOS Home Screen Web App Meta & Icons -->
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <meta name="apple-mobile-web-app-title" content="Parma" id="apple-app-title" />
    <link rel="apple-touch-icon" href="/favicon.png" id="parma-apple-icon" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />
    <link rel="apple-touch-icon-precomposed" href="/apple-touch-icon.png" />

    <!-- Web App Manifest & Dynamic Theme Color -->
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" id="theme-color-meta" content="#f8fafc" />
  </head>
  <body class="bg-wiki-light dark:bg-slate-900 text-slate-900 dark:text-slate-100 transition-colors duration-150">
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
