<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%">
  <rect width="600" height="400" rx="16" fill="#f1f5f9"/>
  <rect x="120" y="40" width="360" height="320" rx="12" fill="#ffffff" stroke="#94a3b8" stroke-width="4"/>
  <!-- Top Control Bar -->
  <rect x="120" y="40" width="360" height="50" rx="12" fill="#1e293b"/>
  <circle cx="160" cy="65" r="8" fill="#10b981"/>
  <rect x="190" y="58" width="60" height="14" rx="4" fill="#334155"/>
  <rect x="260" y="58" width="60" height="14" rx="4" fill="#334155"/>
  <rect x="330" y="58" width="60" height="14" rx="4" fill="#334155"/>
  <circle cx="430" cy="65" r="10" fill="#3b82f6"/>
  <!-- Door Handle -->
  <rect x="160" y="110" width="280" height="12" rx="6" fill="#cbd5e1"/>
  <!-- Internal Filter Schematic in Center -->
  <circle cx="300" cy="240" r="70" fill="#f8fafc" stroke="#64748b" stroke-width="3" stroke-dasharray="6 4"/>
  <!-- Microfilter Mesh Cylindrical core -->
  <rect x="275" y="200" width="50" height="80" rx="6" fill="#e2e8f0" stroke="#475569" stroke-width="2"/>
  <circle cx="300" cy="240" r="15" fill="#3b82f6"/>
  <path d="M220 240 L380 240" stroke="#94a3b8" stroke-width="6" stroke-linecap="round"/>
  <!-- Arrows indicating rotation to unlock -->
  <path d="M260 175 Q300 155 340 175" fill="none" stroke="#2563eb" stroke-width="3" marker-end="url(#arrow)"/>
  <text x="300" y="340" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="600" fill="#475569">Bosch 800 Series — Triple Filtration Assembly</text>
</svg>
